name: CI

on:
  # PR のあるブランチへ push すると push と pull_request の両方が発火して、
  # 同じ commit を 2 回ビルドしていた。push は main だけにして PR 側へ寄せる
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # report ジョブが gh-pages へ push するため
  contents: write

env:
  IMAGE: kirimaru/fastapi-practice_dev-runtime

jobs:
  # uv.lock の内容から決まるタグを算出し、そのタグが既に registry にあるかを判定する。
  # 既にあれば build ジョブはスキップされる（test はこのジョブを待たない）
  meta:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    outputs:
      runtime_tag: ${{ steps.lock.outputs.runtime_tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute runtime tag from uv.lock
        id: lock
        run: |
          set -euo pipefail
          LOCK_HASH=$(sha1sum < backend/uv.lock | cut -d' ' -f1)
          RUNTIME_TAG="python-${LOCK_HASH}"
          echo "runtime_tag=${RUNTIME_TAG}" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_TAG=${RUNTIME_TAG}" >> "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether the runtime image already exists
        id: check
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:${RUNTIME_TAG}" > /dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"
          {
            echo "## Build diagnostics"
            echo
            echo "- RUNTIME_TAG: \`${RUNTIME_TAG}\`"
            echo "- image already exists: \`${EXISTS}\` (true ならビルドはスキップ)"
            echo
            echo "### Versions"
            echo '```'
            docker --version
            docker buildx version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # dev_runtime イメージ（依存入り）を arm64 だけビルドして push する。
  # テストはこのイメージを使わない（下の test ジョブは runner 上で uv run する）ので、
  # ここは「イメージがビルドできること」の確認と、ローカル / 将来のデプロイ向けの配布だけ。
  # 以前は amd64 もネイティブ runner でビルドして manifest list にまとめていたが、使っていないのでやめた
  build:
    needs: meta
    if: needs.meta.outputs.exists != 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      RUNTIME_TAG: ${{ needs.meta.outputs.runtime_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push dev_runtime (arm64)
        run: |
          set -euxo pipefail
          set +e
          docker buildx build \
            --progress=plain \
            --platform linux/arm64 \
            --target dev_runtime \
            --output "type=image,name=${IMAGE}:${RUNTIME_TAG},oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true,push=true" \
            backend 2>&1 | tee /tmp/buildx.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            {
              echo "### buildx build failed (status ${STATUS})"
              echo '```'
              tail -120 /tmp/buildx.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "${STATUS}"
          fi

  # テストはイメージを使わず、runner 上で直接 uv run する（イメージのビルド・pull を待たない）。
  # Docker を使うのは PostgreSQL と S3 モックの service コンテナだけ。
  test:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        # データはメモリ（tmpfs）に置く。使い捨てなので永続化しない
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U postgres -d demo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      storage:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: data-exchange.local,tmp.local
          COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "false"
        # アプリは S3_URL（既定 localhost:9000）を見るので、S3Mock の 9090 を 9000 で公開する
        ports:
          - 9000:9090
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/demo
      S3_URL: localhost:9000
      AWS_S3_ACCESS_KEY: minio
      AWS_S3_SECRET_KEY: minio1234
      S3_BUCKET: tmp.local
      ENV: local
      SECRET: dev-secret-change-me
      GOOGLE_API_KEY: dummy-for-local-ci
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # analyze（jupyter / matplotlib）はテストに使わないので入れない
      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group api --group auth --group worker --group dev

      # ジョブごとに捨てる DB なので、クラッシュへの備えを切って書き込みを速くする
      # （service コンテナは起動コマンドを渡せないので、起動後に ALTER SYSTEM で入れて設定を読み直させる）
      - name: Tune PostgreSQL for throwaway use
        run: |
          docker exec "${{ job.services.db.id }}" psql -U postgres -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: DB migration
        run: uv run alembic upgrade head

      # モデルとマイグレーションのずれを検出する。モデルを変えたのにマイグレーションを
      # 足し忘れると、ここで「New upgrade operations detected」として落ちる
      - name: Check models match migrations
        run: uv run alembic check

      # 並列（ログは CRITICAL だけ）で全テスト -> 失敗したものだけ直列・DEBUG で再実行（scripts/test.sh）
      - name: Run tests
        run: bash scripts/test.sh

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: backend/allure-results
          if-no-files-found: warn
          retention-days: 1

  # 静的チェック。test とは並行して走る（以前は手元の poe lint でしか動いておらず、CI では見ていなかった）
  lint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group api --group auth --group worker --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pyrefly
        run: uv run pyrefly check

      # ty はアプリのコード（src）だけを見る。tests には SQLModel の型付けの都合による指摘が
      # 100 件ほど残っていて、直すとテストの読みやすさが落ちるので対象にしていない
      - name: ty
        run: uv run ty check src

  # frontend がビルドできること（以前は CI で一度もビルドしていなかった）
  frontend:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json のとおりに入れる。.npmrc の Takumi Guard 経由で取得する
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  # prod / worker イメージがビルドできることだけを確かめる（push しない）。
  # 以前 prod ステージは存在しない image を FROM にしていて、誰も気づかないままビルドできなかった
  build-images:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [prod, worker]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # レイヤーを GitHub Actions のキャッシュに残す。`docker buildx build` を run で叩くと
      # キャッシュ API のトークンが渡らないので、type=gha が使える build-push-action にしている。
      # prod と worker は依存の入れ方が違う別のレイヤーになるので、scope を分ける
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Allure レポートの生成と公開。
  #
  # test ジョブに置いていたときは、simple-elf/allure-report-action が Docker action の
  # ため GitHub がジョブ冒頭でそのイメージをビルドしており、ステップの `if:` に関係なく
  # 毎回 27 秒かかっていた。公開するのは main のときだけなので、PR ではこの 27 秒が
  # まるごと無駄になる。ジョブを分けて main でだけ動かす。
  #
  # レポート生成はテストの合否判定ではない（判定は test ジョブの "Run tests"）。
  # アクションのコンテナ内に xargs が無くレポート生成が落ちる事象があったため、
  # ここは CI を落とさない。
  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download Allure results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results

      - name: Build test report
        id: allure
        uses: simple-elf/allure-report-action@v1.15
        continue-on-error: true
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish test report
        if: steps.allure.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
