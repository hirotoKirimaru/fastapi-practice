name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  IMAGE: kirimaru/fastapi-practice_dev-runtime

jobs:
  # uv.lock の内容から決まるタグを算出し、そのタグが既に registry にあるかを判定する。
  # 既にあればビルド系のジョブごとスキップされる
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime_tag: ${{ steps.lock.outputs.runtime_tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute runtime tag from uv.lock
        id: lock
        run: |
          set -euo pipefail
          LOCK_HASH=$(sha1sum < uv.lock | cut -d' ' -f1)
          RUNTIME_TAG="python-${LOCK_HASH}"
          echo "runtime_tag=${RUNTIME_TAG}" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_TAG=${RUNTIME_TAG}" >> "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether the runtime image already exists
        id: check
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:${RUNTIME_TAG}" > /dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"
          {
            echo "## Build diagnostics"
            echo
            echo "- RUNTIME_TAG: \`${RUNTIME_TAG}\`"
            echo "- image already exists: \`${EXISTS}\` (true ならビルドはスキップ)"
          } >> "$GITHUB_STEP_SUMMARY"

  # amd64 / arm64 をそれぞれネイティブ runner でビルドする。
  # 以前は amd64 runner 上で QEMU エミュレーションして arm64 を作っていたため、
  # 200 パッケージ超の uv sync がエミュレーション下で走って非常に遅かった
  build:
    needs: meta
    if: needs.meta.outputs.exists != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RUNTIME_TAG: ${{ needs.meta.outputs.runtime_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push dev_runtime by digest
        id: build
        run: |
          set -euxo pipefail
          set +e
          docker buildx build \
            --progress=plain \
            --platform "${{ matrix.platform }}" \
            --target dev_runtime \
            --metadata-file /tmp/metadata.json \
            --output "type=image,name=${IMAGE},oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true,push-by-digest=true,name-canonical=true,push=true" \
            . 2>&1 | tee /tmp/buildx.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            {
              echo "### ${{ matrix.platform }} buildx build failed (status ${STATUS})"
              echo '```'
              tail -120 /tmp/buildx.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "${STATUS}"
          fi
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 各アーキテクチャの digest を 1 つの manifest list にまとめて、
  # 従来どおり :${RUNTIME_TAG} で multi-arch イメージとして引けるようにする
  merge:
    needs: [meta, build]
    if: needs.meta.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_TAG: ${{ needs.meta.outputs.runtime_tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list & push
        run: |
          set -euxo pipefail
          docker buildx imagetools create -t "${IMAGE}:${RUNTIME_TAG}" \
            $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests))
          docker buildx imagetools inspect "${IMAGE}:${RUNTIME_TAG}"

  test:
    needs: [meta, build, merge]
    # build / merge は「イメージが既にある」ときは skip される。
    # その場合も test は走らせたいので success と skipped の両方を許可する
    if: |
      always() &&
      needs.meta.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.build.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.merge.result)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_TARGET: test
      RUNTIME_TAG: ${{ needs.meta.outputs.runtime_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull dev_runtime image
        run: docker pull "kirimaru/fastapi-practice_dev-runtime:${RUNTIME_TAG}"

      - name: Compose up
        run: docker compose up -d --wait

      - name: DB migration
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: docker compose exec -T api uv run alembic upgrade head

      - name: Run tests
        id: pytest
        run: |
          set +e
          docker compose exec -T api uv run pytest --alluredir=/app/allure-results 2>&1 | tee /tmp/pytest.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Dump diagnostics on failure
        if: always()
        run: |
          {
            echo "## pytest status: ${{ steps.pytest.outputs.status }}"
            echo
            echo "### pytest log (tail)"
            echo '```'
            tail -200 /tmp/pytest.log 2>/dev/null || echo "(no pytest log)"
            echo '```'
            echo
            echo "### docker compose ps"
            echo '```'
            docker compose ps
            echo '```'
            echo
            echo "### api container logs (tail)"
            echo '```'
            docker compose logs --tail=120 api 2>&1 || true
            echo '```'
            echo
            echo "### db container logs (tail)"
            echo '```'
            docker compose logs --tail=60 db 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if pytest failed
        if: steps.pytest.outputs.status != '0'
        run: exit 1

      - name: Post pytest log to PR on failure (diagnostic)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY_FILE=/tmp/pr-comment.md
          {
            echo "### :rotating_light: CI diagnostic dump (\`${{ github.sha }}\`)"
            echo
            echo "pytest status: \`${{ steps.pytest.outputs.status }}\`"
            echo
            echo "<details><summary>pytest log (tail 200)</summary>"
            echo
            echo '```'
            tail -200 /tmp/pytest.log 2>/dev/null || echo "(no pytest log)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>docker compose ps</summary>"
            echo
            echo '```'
            docker compose ps || true
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>api container logs (tail 120)</summary>"
            echo
            echo '```'
            docker compose logs --tail=120 api 2>&1 || true
            echo '```'
            echo
            echo "</details>"
          } > "$BODY_FILE"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --data @<(jq -Rs '{body: .}' < "$BODY_FILE") \
            || true

      - name: Copy Allure results from container
        if: always()
        run: docker cp "$(docker compose ps -q api)":/app/allure-results ./allure-results

      # レポート生成は結果の可視化用であって、テストの合否判定ではない
      # (合否は上の "Fail if pytest failed" が pytest の終了コードで判定している)。
      # サードパーティ action 側の都合 (2026-08 時点で action のコンテナに xargs が
      # 無くレポート生成に失敗する) で CI 全体が落ちないよう、非ブロッキングにする
      - name: Build test report
        id: allure
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        continue-on-error: true
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: allure-results

      - name: Publish test report
        if: always() && github.ref == 'refs/heads/main' && steps.allure.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
