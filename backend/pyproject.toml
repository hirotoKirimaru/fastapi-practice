[project]
name = "fastapi-practice"
version = "0.1.0"
description = "Add your description here"
# API と worker の両方が使うものだけを置く。どちらか片方だけのものは下の dependency-groups へ
dependencies = [
    # PostgreSQL ドライバ。同期（alembic / migrate_db / worker）と非同期（API）の両方をこれ1つで賄う
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.3",
    "sqlmodel>=0.0.50",
    # API は投入（send_task）、worker は実行に使う。投入にも Celery の形式でメッセージを
    # 組み立てるクライアントが要るので共通に置く（タスクの実装は import しない）
    "celery[redis]>=5.7.0",
]
requires-python = ">= 3.15"

[dependency-groups]
# API（FastAPI）のプロセスだけが使うもの。worker のイメージには入れない
api = [
    "fastapi[standard]>=0.163.1",
    "strawberry-graphql[fastapi]>=0.341.2",
    # SQLAlchemy の asyncio 拡張が使う。worker は同期で DB を触るので不要
    "greenlet>=3.5.6",
    "polars>=2.1.0",
    "boto3>=1.44.3",
    "passlib>=1.7.4",
    "tenacity>=9.1.4",
    "google-genai>=3.3.0",
    "sentry-sdk>=2.75.0",
]
# Celery の worker だけが使うもの（今は共通の依存だけで足りている）
worker = []
auth = [
    "pyjwt>=2.15.1",
    "pyotp>=2.11.2",
]


dev = [
    "ruff>=0.17.5",
    "pytest-asyncio>=1.5.0",
    "pytest-mock>=3.17.0",
    "pytest-check>=3.0.3",
    "alembic>=1.20.1",
    "allure-pytest>=2.16.2",
    "types-passlib>=1.7.7.20260211",
    "ty>=0.0.104",
    "tuna>=0.5.15",
    "poethepoet>=0.49.0",
    # tests/unit/crud/test_np_nan.py が直接 import する。
    # 以前は analyze グループの matplotlib 経由で入っていたが、明示的に宣言する
    "numpy>=2.5.4",
    "pyrefly>=1.4.1",
    "pytest-xdist>=3.8.0",
]
analyze = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]

[tool.pyrefly.errors]
unannotated-return = "error"
no-any-return = "error"
redundant-cast = "warn"
implicit-any = "error"
method-assign = "error"
redefinition = "ignore"
implicit-any-parameter = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# uv >= 0.5: "all" 文字列ではなく "all-groups" を使う
default-groups = ["api", "auth", "worker", "dev", "analyze"]


# Takumi Guard（GMO Flatt Security）の PyPI プロキシを既定のインデックスにし、既知の悪性パッケージを
# インストール前にブロックする（匿名モード・トークンなし）。pyproject に書いておけば、ローカル・CI
# （setup-uv）・Docker ビルドの uv がすべてここを通る。
# https://shisho.dev/docs/t/guard/quickstart/pypi/
[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]


# ------------------------------------------------------------------------------
# ruff 0.16 でデフォルトのルールセットが大きく拡張された（UP/B/DTZ/PYI など）。
# 暗黙のデフォルトに任せると ruff を上げるたびに指摘が増減するため、
# このリポジトリで意図的に許容している書き方をここに明示しておく。
# ------------------------------------------------------------------------------
[tool.ruff.lint.flake8-bugbear]
# FastAPI は Depends() / File() / Body() / Security() を引数のデフォルト値に置くのが
# 公式の書き方。B008 の指摘どおりに直すと DI が壊れるので対象から外す。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# (1) 「その書き方をするとどうなるか」を実演すること自体が目的のコード。
#     指摘どおりに直すと題材そのものが消えるため除外する。
"src/api/routers/array_factory.py" = ["B006"]      # ミュータブルなデフォルト引数の挙動確認
"src/api/routers/exception.py" = ["TRY002"]        # 未処理例外時のレスポンス確認用エンドポイント
"tests/unit/models/test_default_parameter.py" = ["B006"]   # 同上（docstring で「ダメ」と明記済み）
"tests/unit/test_raise_error.py" = ["B018", "BLE001"]      # 1/0 で送出させる例外連鎖の確認
"tests/unit/models/test_for_pythonista.py" = ["PERF402"]   # for ループと内包表記の速度比較が主題
"tests/unit/models/test_nested.py" = ["PLR0133"]           # 常に真の比較を意図的に書いている
"tests/unit/decolator/test_decolator.py" = ["PLR0133"]     # 同上
# (2) naive datetime（tzinfo なし）を扱うこと自体がテスト対象、
#     あるいは DB のカラムが naive なためテストデータも naive で揃える必要がある。
"tests/unit/schemas/test_datetime_serialize.py" = ["B015", "DTZ001"]
"tests/unit/helper/test_datetime_resolver.py" = ["DTZ001"]
"tests/unit/crud/test_user.py" = ["DTZ005"]
"tests/helpers/tests/test_custom_assert.py" = ["DTZ011"]
# (3) SQLModel の Relationship は、循環 import を避けて TYPE_CHECKING 下でしか import
#     していないモデルを文字列の前方参照（"Post" / Optional["User"]）で指している。
#     requires-python を 3.14 以上にすると UP037 / UP045 が引用符を外させにくるが、
#     外すと SQLModel / pydantic がクラス定義時に名前を解決できなくなるので対象から外す。
"src/models/*.py" = ["UP037", "UP045"]
# (4) テスト内の同期ファイル I/O。実行時間に影響しないため許容する。
"tests/helpers/test_aws.py" = ["ASYNC230", "DTZ005"]
"tests/helpers/test_files.py" = ["ASYNC230"]

[tool.poe.tasks]
hello = "echo 'hello, poe!'"
# 並列（ログは CRITICAL だけ）で全テスト -> 失敗したものだけ直列・DEBUG で再実行。
# PYTEST_WORKERS で並列数を変えられる（既定 auto、0 で直列）。詳しくは scripts/test.sh
test = { shell = "bash scripts/test.sh" }
# import の並べ替え(I)も整形も ruff が持っているので、black / isort は使わない。
# 併用すると同じ行を互いに書き換え合って poe lint のたびに差分が出る。
lint = { sequence = ["lint:ruff", "lint:format", "lint:pyrefly", "lint:ty" ] }
"lint:ruff" = "ruff check . --fix"
"lint:format" = "ruff format ."
"lint:pyrefly" = "pyrefly check"  # 対象は [tool.pyrefly] の project-includes（src のみ・tests は見ない）
"lint:ty" = "ty check src"

# ruff check / ruff format / ty をまとめて実行する
check = { sequence = ["check:ruff", "check:format", "check:ty"] }
"check:ruff" = "ruff check . --fix"
"check:format" = "ruff format ."
"check:ty" = "ty check src"

start = "uvicorn src.main:app --host 0.0.0.0 --reload"
production = "uvicorn src.main:app --workers 4"
pre-start = "python -m src.backend_pre_start"


[tool.pyrefly]
# 型チェックは pyrefly（mypy から移行）と ty の 2 本立て。
# preset / 各設定は `pyrefly init` が旧 [tool.mypy] の設定から引き継いだもの（legacy = mypy に近い挙動）
project-includes = ["src"]
preset = "legacy"
ignore-missing-imports = ["*"]
check-unannotated-defs = true
infer-return-types = "never"
