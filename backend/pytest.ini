[pytest]
# テストディレクトリの指定
testpaths = tests

# テストファイルの検索パターン
python_files = test_*.py *_test.py

# テスト関数やメソッドの検索パターン
python_functions = test_

# コンソールに詳細な情報を表示するかどうか
# ログの出し方は実行のしかたで変える（poe test を参照）。
#   並列（xdist）: --log-level=CRITICAL で捕捉するログを最小にし、メモリと出力を抑える
#   失敗したテストの直列での再実行: --log-level=DEBUG と -s で全部見る
addopts = -ra --alluredir allure-results

asyncio_mode = auto

# pytestのIDの日本語化
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

asyncio_default_fixture_loop_scope = function