[project]
name = "fastapi-practice"
version = "0.1.0"
description = "Add your description here"
dependencies = [
    "aiomysql>=0.3.2",
    "polars>=1.36.1",
    "boto3>=1.42.18",
    "pydantic-settings>=2.12.0",
    "passlib>=1.7.4",
    "tenacity>=9.1.2",
    "google-genai>=1.0.0",
    "sqlmodel>=0.0.31",
    "pydantic[email]>=2.12.5",
    "sentry-sdk>=2.48.0",
    "greenlet>=3.3.0",
    "strawberry-graphql[fastapi]>=0.314.3",
]
readme = "README.md"
requires-python = ">= 3.13"

[dependency-groups]
api = [
    "fastapi[standard]>=0.136.0"
]
auth = [
    "pyjwt>=2.10.1",
    "pyotp>=2.9.0",
]

worker = [
    "celery>=5.6.1",
]

dev = [
    "ruff>=0.14.7",
    "pytest-asyncio>=0.26.0",
    "aiosqlite>=0.22.1",
    "pytest-mock>=3.15.1",
    "black>=25.12.0",
    "pytest-check>=2.6.2",
    "mypy>=1.19.1",
    "testcontainers>=4.1.1",
    "minio>=7.2.5",
    "alembic>=1.13.1",
    "allure-pytest>=2.13.5",
    "types-passlib>=1.7.7.20240327",
    "isort>=5.13.2",
    "ty>=0.0.8",
    "tuna>=0.5.11",
    "poethepoet>=0.39.0",
]
analyze = [
    "jupyter>=1.1.1",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# uv >= 0.5: "all" 文字列ではなく "all-groups" を使う
default-groups = ["api", "auth", "worker", "dev", "analyze"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]


# ------------------------------------------------------------------------------
# ruff 0.16 でデフォルトのルールセットが大きく拡張された（UP/B/DTZ/PYI など）。
# 暗黙のデフォルトに任せると ruff を上げるたびに指摘が増減するため、
# このリポジトリで意図的に許容している書き方をここに明示しておく。
# ------------------------------------------------------------------------------
# isort 単体と ruff の I001（ruff 0.16 でデフォルト入り）は、プロファイル未指定だと
# 並べ方が食い違い、poe lint を回すたびに import 行が往復してしまう。
# black 互換プロファイルを明示して両者の結果を一致させる。
[tool.isort]
profile = "black"

[tool.ruff.lint.flake8-bugbear]
# FastAPI は Depends() / File() / Body() / Security() を引数のデフォルト値に置くのが
# 公式の書き方。B008 の指摘どおりに直すと DI が壊れるので対象から外す。
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# (1) 「その書き方をするとどうなるか」を実演すること自体が目的のコード。
#     指摘どおりに直すと題材そのものが消えるため除外する。
"src/api/routers/array_factory.py" = ["B006"]      # ミュータブルなデフォルト引数の挙動確認
"src/api/routers/exception.py" = ["TRY002"]        # 未処理例外時のレスポンス確認用エンドポイント
"tests/unit/models/test_default_parameter.py" = ["B006"]   # 同上（docstring で「ダメ」と明記済み）
"tests/unit/test_raise_error.py" = ["B018", "BLE001"]      # 1/0 で送出させる例外連鎖の確認
"tests/unit/models/test_for_pythonista.py" = ["PERF402"]   # for ループと内包表記の速度比較が主題
"tests/unit/models/test_nested.py" = ["PLR0133"]           # 常に真の比較を意図的に書いている
"tests/unit/decolator/test_decolator.py" = ["PLR0133"]     # 同上
# (2) naive datetime（tzinfo なし）を扱うこと自体がテスト対象、
#     あるいは DB のカラムが naive なためテストデータも naive で揃える必要がある。
"tests/unit/schemas/test_datetime_serialize.py" = ["B015", "DTZ001"]
"tests/unit/helper/test_datetime_resolver.py" = ["DTZ001"]
"tests/unit/crud/test_user.py" = ["DTZ005"]
"tests/helpers/tests/test_custom_assert.py" = ["DTZ011"]
# (3) テスト内の同期ファイル I/O。実行時間に影響しないため許容する。
"tests/helpers/test_aws.py" = ["ASYNC230", "DTZ005"]
"tests/helpers/test_files.py" = ["ASYNC230"]

[tool.poe.tasks]
hello = "echo 'hello, poe!'"
lint = { parallel = ["lint:black", "lint:ruff", "lint:mypy", "lint:isort", "lint:ty" ] }
"lint:black" = "black ."
"lint:ruff" = "ruff check . --fix"
"lint:mypy" = "mypy ./src" # testディレクトリは無視
"lint:isort" = "isort ."
"lint:ty" = "ty check src"

# ruff check / ruff format / ty をまとめて実行する
check = { sequence = ["check:ruff", "check:format", "check:ty"] }
"check:ruff" = "ruff check . --fix"
"check:format" = "ruff format ."
"check:ty" = "ty check src"

start = "uvicorn src.main:app --host 0.0.0.0 --reload"
production = "uvicorn src.main:app --workers 4"
pre-start = "python -m src.backend_pre_start"

[tool.mypy]
allow_redefinition = true
allow_untyped_globals = false
check_untyped_defs = true
color_output = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = true
error_summary = true
ignore_missing_imports = true
implicit_reexport = true
namespace_packages = true
no_implicit_optional = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
strict = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = false
