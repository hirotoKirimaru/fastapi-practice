x-common-env: &common_env
  AWS_S3_ACCESS_KEY: minio
  AWS_S3_SECRET_KEY: minio1234

services:
  api:
    build:
      context: .
      target: ${BUILD_TARGET:-dev}
      args:
        - RUNTIME_TAG=${RUNTIME_TAG:-latest}
    volumes:
      # アプリ側パスは /app（Dockerfile の WORKDIR と合わせる）
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
    environment:
      <<: *common_env
      ENV: local
      S3_BUCKET: tmp.local
      # ローカル / CI 用のダミー値。本番は .env 等で上書きする
      SECRET: ${SECRET:-dev-secret-change-me}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-dummy-for-local-ci}
      PROJECT_NAME: ${PROJECT_NAME:-fastapi-practice}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
    ports:
      - "8000:8000"
    networks:
      - development_network
    depends_on:
      - db
      - storage

  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: demo
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    command: --mysql-native-password=ON
    ports:
      - "33306:3306"
    networks:
      - development_network

  storage:
    # MinIO の公開イメージが Docker Hub と quay.io の両方から無くなった
    # （どちらも匿名 pull が unauthorized。#15 で quay へ逃がしたが、そこも非公開化された）
    # ため、S3 互換のモックに置き換える。
    # このリポジトリが S3 に求めるのは src/helper/aws.py の upload_fileobj と取得だけなので
    # これで足りる。⚠️ MinIO のコンソール UI (:9001) は無くなる。
    image: adobe/s3mock:5.2.3
    # S3Mock が listen するのは 9090 (HTTP) / 9191 (HTTPS)。
    # コンテナ内から localhost:9000 で引けるようにするのは下の relay の仕事
    ports:
      - "9090:9090"
    volumes:
      # 名前付きボリュームを使う場合、保存先は /s3mockroot でなければならない
      # （イメージは非 root の cnb ユーザで動き、その所有で用意されているのがこのパスだけ）
      - s3mock_data:/s3mockroot
    environment:
      # MinIO では datadir に mkdir していたバケット作成を置き換える
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: data-exchange.local,tmp.local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      ENV_TEST: ${CI+AAA}${CI-BBB}
    env_file:
      - docker.env
    networks:
      - development_network

  kvs:
    image: redis:7-alpine
    volumes:
      - kvs_data:/data
    networks:
      - development_network

  mail:
    # MailHog はメンテ停止のため後継の mailpit を使用（互換 UI/SMTP）
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - development_network

  # docker network 内 localhost:9000 でストレージにアクセスさせるための中継。
  # アプリ側（src/helper/aws.py の S3_URL のデフォルト）は localhost:9000 を見るので、
  # 9000 で受けて S3Mock の 9090 へ渡す。ここでポートを吸収しているため
  # アプリのコードと S3_URL は変更不要
  relay:
    image: alpine/socat
    depends_on:
      - api
      - storage
    command: "TCP-LISTEN:9000,fork TCP:storage:9090"
    network_mode: service:api

  frontend:
    # バックエンドだけ動かしたいときに巻き込まれないよう profile に入れる。
    # .env に COMPOSE_PROFILES=frontend があれば従来どおり `docker compose up` で
    # 一緒に起動する (.env.example に入れてある)。profile 無しでも
    # `docker compose up frontend` と名指しすれば起動する
    profiles: ["frontend"]
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    ports:
      - "5173:5173"
    networks:
      - development_network
    depends_on:
      - api

volumes:
  mysql_data:
  s3mock_data:
  kvs_data:

networks:
  development_network:
